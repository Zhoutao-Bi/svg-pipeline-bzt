services:
  stl2json:
    build: .
    image: stl2json:latest
    container_name: stl2json
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?请先设置 OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini-2025-08-07}
      - LLM_CONCURRENCY=${LLM_CONCURRENCY:-1}
      - SLICE_MODE=${SLICE_MODE:-coarse}
      - PIPELINE_TIMEOUT=${PIPELINE_TIMEOUT:-300}
      - INPUT_STL_DIR=/app/input_stl
      - RESULTS_DIR=/app/results
    volumes:
      - ./input_stl:/app/input_stl:ro
      - ./results:/app/results
    command: ${WORKFLOW:-run_visual_only.py}

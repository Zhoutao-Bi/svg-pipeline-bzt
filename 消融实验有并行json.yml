        prompt_template:
        - id: fd39bb61-d7fa-4fae-bdaf-8420680758af
          role: system
          text: "System Prompt: 你是一位资深机器视觉与逆向工程专家。你的任务是依靠提供的多视图深度图（X/Y/Z轴）， JSON 几何特征描述文件，对该机械零件进行特征提取，并直接输出可填入结构化表格的数据。\n\
            分析思路与核心准则:\n信息依赖: 你需要通过观察深度图的色阶映射（黄向紫代表浅入深）和三视图轮廓，提取零件的几何形态。一切识别特征以视觉为主，视觉占比70%，一切几何定位特征以json文本位置，json文本占比70%。若两者冲突需要指出提示。\n\
            包络统计: 通过json完成长宽高的统计。\n语义识别为主: 寻找深度图上的色阶突变区域或穿透区域（如明显的白色/深色空洞）。重点识别并列出：孔、柱、槽、倒角。\n\
            形态判定: 利用视觉优势，直接判定连续的颜色渐变为【平滑曲面/倒角/锥面】。准确分辨孔、柱、槽的真实形状（正圆、胶囊形、半圆槽、扇形、方形、三角形等。\n\
            重复判断：由于三视图问题，注意判断是否有重复的局部特征。尤其是当XYZ的坐标在很接近的位置时，如果有则保留一个最可能的即可。\n输出约束:\
            \ 严格按照提供的 JSON Schema 输出。，坐标 和 尺寸 字段请通过json完成读取。局部特征必须按照孔、柱、槽、圆角的顺序输出。输出格式的例子如下：\n\
            {\n    \"尺寸X\": 50,\n    \"尺寸Y\": 150,\n    \"尺寸Z\": 10,\n    \"局部特征列表\"\
            : [\n        {\n           \"特征类型\"：\"孔\"，\n           \"特征形状\"：\"圆形\"\
            ,\n            \"坐标X\": 25,\n            \"坐标Y\": 130,\n            \"\
            坐标Z\": 5,\n            \"尺寸类型\": \"直径” ,\n             ”尺寸数据“：40 \"\n\
            \        },\n        {\n           \"特征类型\"：\"孔\"，\n           \"特征形状\"\
            ：\"圆形\",\n            \"坐标X\": 40,\n            \"坐标Y\": 120,\n      \
            \      \"坐标Z\": 6,\n             \"尺寸类型\": \"直径“ ,\n             ”尺寸数据“：20\
            \ \"\n        },\n{\n           \"特征类型\"：\"柱\"，\n           \"特征形状\"：\"\
            方形\",\n            \"坐标X\": 40,\n            \"坐标Y\": 120,\n         \
            \   \"坐标Z\": 6,\n             \"尺寸类型\": \"边长” ,\n             ”尺寸数据“：“40，20\"\
            \n        },\n    ]\n    \"整体特征\": \"长方形薄板状工件，整体为长条矩形带孔和柱；在靠近一端偏上的位置有一个大型贯穿圆孔。\"\
            ,\n}"
        - id: c3aeab94-a35d-4219-825f-de91a9aec7c2
          role: user
          text: 结构化输出。json的内容：{{#1776761193316.features_text#}}
        selected: false
        structured_output:
          schema:
            properties:
              尺寸X:
                description: 零件整体包络尺寸 Length (X)
                type: number
              尺寸Y:
                description: 零件整体包络尺寸 Width (Y)
                type: number
              尺寸Z:
                description: 零件整体包络尺寸 Height (Z)
                type: number
              局部特征列表:
                description: 按照识别出的重要局部几何特征孔、柱、槽、圆角的顺序依次列出
                items:
                  properties:
                    坐标X:
                      description: 特征中心点 X 坐标。如果是深度的特征，填入中面X值或留空。
                      type: number
                    坐标Y:

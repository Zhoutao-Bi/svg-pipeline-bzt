                      type: string
                    特征形状:
                      description: 这个特征类型是什么形状的，只能回答以下其中一个词语：圆形、类圆形、三角形、四边形、五边形、六边形、多边形、其他。
                      type: string
                    特征类型:
                      description: 只能回答以下其中一个词语：孔、柱、槽、倒角
